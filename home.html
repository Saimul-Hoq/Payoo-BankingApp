<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- Tailwind + daisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>  
    
    <!-- font  -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <section id="header">
        <div class="flex border-b border-base-content/20 bg-base-100 p-5">
                
            <div class="navbar-start ">
                <div class="w-[30%]">
                    <img src="./assets/logo.png" alt="">
                </div>
                <div class="ml-2">
                    <h1 class="text-2xl">$ <span id="total-amount">45000</span></h1>
                    <p class="text-base-content/50 leading-none">Available Balance</p>
                </div>
                
            </div>
        
            <div class="navbar-end scale-90">
                <button id="logOut-btn" class="btn bg-base-100 rounded-md font-normal text-xl text-base-content/60"><i class="fa-solid fa-right-from-bracket"></i>
                Log Out</button>
                <button id="theme-toggle-btn" class="btn btn-ghost btn-circle">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </section>
    <section class="px-5 py-8 bg-base-100 rounded-b-3xl border-b-2 border-base-content/10">
        <h1 class="text-2xl font-semibold">Welcome to Pay<span class="text-primary">oo</span></h1>
        <p class="text-base-content/50 mt-3">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

        <div class="grid grid-cols-3 gap-3 mt-5">
            <!-- Add Money Button______________________________________ -->
            <button id="addMoney-btn" data-target="#addMoney-section" class="btn h-full flex-col py-4 rounded-xl btn-primary btn-soft group">
                <div ><img class="mx-auto" src="./assets/opt-1.png" alt=""></div>
                <p class="text-primary font-normal group-hover:text-white">Add Money</p>
            </button>
            <!-- Cashout Button______________________________________ -->
            <button id="cashout-btn" data-target="#cashout-section" class="btn h-full flex-col py-4 rounded-xl btn-primary btn-soft group">
                <div ><img class="mx-auto" src="./assets/opt-2.png" alt=""></div>
                <p class="text-primary font-normal group-hover:text-white">Cashout</p>
            </button>
            <!-- Transfer Button______________________________________ -->
            <button id="transfer-btn" data-target="#transfer-section" class="btn h-full flex-col py-4 rounded-xl btn-primary btn-soft group">
                <div ><img class="mx-auto" src="./assets/opt-3.png" alt=""></div>
                <p class="text-primary font-normal group-hover:text-white">Transfer</p>
            </button>
            <!-- Bonus Button______________________________________ -->
            <button id="bonus-btn" data-target="#bonus-section" class="btn h-full flex-col py-4 rounded-xl btn-primary btn-soft group">
                <div ><img class="mx-auto" src="./assets/opt-4.png" alt=""></div>
                <p class="text-primary font-normal group-hover:text-white">Get Bonus</p>
            </button>
            <!-- Pay Bill Button______________________________________ -->
            <button id="payBill-btn" data-target="#payBill-section" class="btn h-full flex-col py-4 rounded-xl btn-primary btn-soft group">
                <div ><img class="mx-auto" src="./assets/opt-5.png" alt=""></div>
                <p class="text-primary font-normal group-hover:text-white">Pay Bill</p>
            </button>
            <!-- Transactions Button______________________________________ -->
            <button id="transactions-btn" data-target="#transactions-section" class="btn h-full flex-col py-4 rounded-xl btn-primary btn-soft group">
                <div ><img class="mx-auto" src="./assets/opt-6.png" alt=""></div>
                <p class="text-primary font-normal group-hover:text-white">Transactions</p>
            </button>
            
        </div>
    </section>

    <!-- Cashout Section______________________________________________-->
    <section id="cashout-section" class="my-4 w-11/12 mx-auto hidden">
        <h1 class="text-2xl">Cashout</h1>
        <fieldset class="fieldset bg-base-100 border-base-300 rounded-2xl w-full border p-5 mx-auto my-4">
        <!-- <legend class="fieldset-legend">Login</legend> -->

        <label class="label text-base-content text-sm">Agent Number</label>
        <input id="agent-number" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Enter 11 digit number" />
        <label class="label text-base-content text-sm">Amount</label>
        <input id="amount" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Enter amount to withdraw" />
        <label class="label text-base-content text-sm">Pin Number</label>
        <input id="pin" maxlength="4" minlength="4" type="password" class="input rounded-full w-full bg-base-200" placeholder="Enter 4 digit pin number" />

        <button id="withdraw-btn" class="btn btn-primary mt-4 rounded-full w-full text-xl font-normal">Withdraw Money</button>
        </fieldset>
    </section>

    <!-- Transfer Section______________________________________________-->
    <section id="transfer-section" class="my-4 w-11/12 mx-auto hidden">
        <h1 class="text-2xl">Transfer Money</h1>
        <fieldset class="fieldset bg-base-100 border-base-300 rounded-2xl w-full border p-5 mx-auto my-4">
        <!-- <legend class="fieldset-legend">Login</legend> -->

        <label class="label text-base-content text-sm">User Account Number</label>
        <input id="user-account-number" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Enter 11 digit number" />
        <label class="label text-base-content text-sm">Amount</label>
        <input id="transfer-amount" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Enter amount to withdraw" />
        <label class="label text-base-content text-sm">Pin Number</label>
        <input id="transfer-pin" maxlength="4" minlength="4" type="password" class="input rounded-full w-full bg-base-200" placeholder="Enter 4 digit pin number" />

        <button id="send-now-btn" class="btn btn-primary mt-4 rounded-full w-full text-xl font-normal">Send Now</button>
        </fieldset>
    </section>

    <!-- Bonus Section______________________________________________-->
    <section id="bonus-section" class="my-4 w-11/12 mx-auto hidden">
        <h1 class="text-2xl">Get Bonus</h1>
        <fieldset class="fieldset bg-base-100 border-base-300 rounded-2xl w-full border p-5 mx-auto my-4">
        <!-- <legend class="fieldset-legend">Login</legend> -->

        <label class="label text-base-content text-sm">Enter Bonus Coupon</label>
        <input id="bonus" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Enter your bonus coupon" />
        

        <button id="get-bonus-btn" class="btn btn-primary mt-4 rounded-full w-full text-xl font-normal">Get Bonus</button>
        </fieldset>
    </section>

    <!-- Add Money Section______________________________________________-->
    <section id="addMoney-section" class="my-4 w-11/12 mx-auto hidden">
        <h1 class="text-2xl">Add Money</h1>
        <fieldset class="fieldset bg-base-100 border-base-300 rounded-2xl w-full border p-5 mx-auto my-4">
        <!-- <legend class="fieldset-legend">Login</legend> -->
        
        <label class="label text-base-content text-sm">Select A Bank</label>
        <select id="user-bank" class="select rounded-full w-full mb-3 bg-base-200">
            <option value="" disabled selected hidden>Select your bank</option>
            <option value="dbbl">Dutch-Bangla Bank</option>
            <option value="islami">Islami Bank Bangladesh</option>
            <option value="brac">BRAC Bank</option>
            <option value="city">City Bank</option>
            <option value="ebl">Eastern Bank (EBL)</option>
        </select>
        <label class="label text-base-content text-sm">Bank Account Number</label>
        <input id="bank-account-number" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Enter 11 digit account number" />
        <label class="label text-base-content text-sm">Amount to add</label>
        <input id="addMoney-amount" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Add amount to withdraw" />
        <label class="label text-base-content text-sm">Pin Number</label>
        <input id="addMoney-pin" maxlength="4" minlength="4" type="password" class="input rounded-full w-full bg-base-200" placeholder="Enter 4 digit pin number" />

        <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full w-full text-xl font-normal">Add Money</button>
        </fieldset>
    </section>

    <!-- Pay Bill Section______________________________________________-->
    <section id="payBill-section" class="my-4 w-11/12 mx-auto hidden">
        <h1 class="text-2xl">Pay Bill</h1>
        <fieldset class="fieldset bg-base-100 border-base-300 rounded-2xl w-full border p-5 mx-auto my-4">
        <!-- <legend class="fieldset-legend">Login</legend> -->
        
        <label class="label text-base-content text-sm">Select To Pay</label>
        <select id="bill-type" class="select rounded-full w-full mb-3 bg-base-200">
            <option value="" disabled selected hidden>Select Bill</option>
            <option value="electricity">Electricity Bill</option>
            <option value="gas">Gas Bill</option>
            <option value="water">Water Bill</option>
        </select>
        <label class="label text-base-content text-sm">Biller Account Number</label>
        <input id="biller-account-number" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Enter biller account number" />
        <label class="label text-base-content text-sm">Amount to pay</label>
        <input id="payBill-amount" maxlength="11" minlength="11" type="text" class="input rounded-full w-full mb-3 bg-base-200" placeholder="Add amount to pay" />
        <label class="label text-base-content text-sm">Pin Number</label>
        <input id="payBill-pin" maxlength="4" minlength="4" type="password" class="input rounded-full w-full bg-base-200" placeholder="Enter 4 digit pin number" />

        <button id="pay-now-btn" class="btn btn-primary mt-4 rounded-full w-full text-xl font-normal">Pay Now</button>
        </fieldset>
    </section>

    <script type="module" src="./machine.js"></script>
    <script type="module" src="./home.js"></script>
    <script type="module" src="./cashout.js"></script>
    <script type="module" src="./addMoney.js"></script>
    <script type="module" src="./transfer.js"></script>
    <script type="module" src="./bonus.js"></script>
    <script type="module" src="./payBill.js"></script>
    <script type="module" src="./theme.js"></script>




</body>
</html>
